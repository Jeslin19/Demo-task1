apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-task1
  labels:
    app: demo-task1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-task1
  template:
    metadata:
      labels:
        app: demo-task1
    spec:
      containers:
            - name: demo-task1
        image: dockerimage12.azurecr.io/demo-task1:latest
        ports:
                - containerPort: 80
